# SEC-04: cabeceras de seguridad compartidas.
# nginx NO hereda add_header del bloque server en un location que declare los suyos,
# por eso este archivo se incluye en el server y en cada location con add_header propio.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# TODO(SEC-04): añadir el host publico de MinIO en img-src y connect-src cuando se confirme.
# TODO(SEC-04): confirmar que el dominio de Auth0 de produccion coincide con el de desarrollo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lXwiaIWNjl8c4HsKr/wCvNpvrz77iYPpqpTtlo+jaPw=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://dev-uzssz142azr2k5hv.us.auth0.com https://api.mapbox.com https://nominatim.openstreetmap.org; frame-src https://dev-uzssz142azr2k5hv.us.auth0.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

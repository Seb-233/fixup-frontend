name: Frontend CD

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/seb-233/fixup-frontend

jobs:
  build-and-deploy:
    name: Build, push & deploy
    runs-on: self-hosted
    environment: Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute short SHA
        id: sha
        run: |
          SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Production Environment Variables
        run: |
          cat <<EOF > src/environments/environment.ts
          export const environment = {
            production: true,
            apiOrigin: '${{ secrets.API_ORIGIN }}',
            auth0: {
              domain: '${{ secrets.AUTH0_DOMAIN }}',
              clientId: '${{ secrets.AUTH0_CLIENT_ID }}',
              audience: '${{ secrets.AUTH0_AUDIENCE }}'
            },
            native: {
              appId: 'com.fixup.app'
            }
          };
          EOF

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yml || true

      - name: Sync Kubernetes Secrets
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=fixup \
            --docker-server=ghcr.io \
            --docker-username=seb-233 \
            --docker-password="${{ secrets.GHCR_PAT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply infrastructure manifests
        run: |
          kubectl apply -f k8s/frontend-service.yml
          kubectl apply -f k8s/frontend-ingress.yml

      - name: Apply frontend deployment
        run: kubectl apply -f k8s/frontend-deployment.yml

      - name: Update image tag
        run: |
          kubectl set image deployment/fixup-frontend \
            fixup-frontend=${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }} \
            --namespace=fixup

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fixup-frontend \
            --namespace=fixup \
            --timeout=180s

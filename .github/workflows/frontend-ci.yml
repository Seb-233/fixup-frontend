name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - 'setup/**'
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
      - 'docs/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  security-audit:
    name: Security and Secrets Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify forbidden and sensitive files
        run: |
          echo "Checking tracked files against forbidden patterns..."
          FORBIDDEN=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.jks$|\.keystore$|\.p12$|\.pfx$|google-services\.json$|GoogleService-Info\.plist$|service-account.*\.json$|firebase-admin.*\.json$|local\.properties$|key\.properties$|keystore\.properties$|\.apk$|\.aab$' | grep -v '\.env\.example$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden or sensitive files tracked by Git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Security audit passed: No forbidden files detected."

  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --watch=false

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Android debug application
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fixup-frontend:ci .
